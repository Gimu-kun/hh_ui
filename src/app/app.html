<div class="web-app-layout">
  <!-- Left Sidebar Navigation -->
  <app-sidebar></app-sidebar>

  <!-- Right Main App Area -->
  <div class="app-main-container">
    <!-- Top App Header -->
    <app-header></app-header>

    <!-- Main Content Viewport -->
    <main class="app-content-viewport" role="main">
      <div class="content-wrapper fade-in">
        @switch (nav.currentView()) {
          @case ('balance') {
            <app-solver-balance
              [initialEquation]="nav.viewData()?.equation"
            ></app-solver-balance>
          }
          @case ('chain') {
            <app-solver-chain
              [initialStart]="nav.viewData()?.start"
              [initialTarget]="nav.viewData()?.target"
            ></app-solver-chain>
          }
          @case ('quantity') {
            <app-solver-quantity></app-solver-quantity>
          }
          @case ('substance') {
            <app-substance-detail
              [formula]="nav.selectedSubstanceFormula()"
            ></app-substance-detail>
          }
          @case ('periodic') {
            <app-periodic-table></app-periodic-table>
          }
          @case ('activity') {
            <app-activity-series></app-activity-series>
          }
          @case ('crud') {
            <app-knowledge-crud></app-knowledge-crud>
          }
        }
      </div>
    </main>
  </div>
</div>
